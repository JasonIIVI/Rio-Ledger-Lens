# @claude on demand: mention @claude in an issue, a PR comment or a review and
# Claude Code answers in the thread, with the repository checked out.
#
# Prerequisites, both outside this file:
#   - the Claude GitHub App installed on the repository (https://github.com/apps/claude)
#   - ANTHROPIC_API_KEY in the repository secrets
# GitHub only runs issue/comment-triggered workflows from the default branch, so
# this file is live once it is on main.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: a review can check when a file changed relative to a
          # run (the first review could not, and asked for this).
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
