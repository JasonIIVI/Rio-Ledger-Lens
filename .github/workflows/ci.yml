name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # ubuntu-latest became Ubuntu 26.04 in November 2026, and setup-python has no 3.9 for
    # it: 3.9 runs on 24.04 for as long as GitHub keeps that image. An expression, not a
    # matrix key, so the check names stay "test (3.9)", "test (3.11)", "test (3.12)".
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm,mcp]"

      # This job is the suite's run without pyarrow (see the dashboard job below). A
      # dependency that began to bring pyarrow in would change how pandas 3 keeps text
      # here, and nothing else would say so.
      - name: No pyarrow in this job
        run: |
          python -c "import importlib.util, sys; sys.exit('pyarrow is installed in this job' if importlib.util.find_spec('pyarrow') else 0)"

      - name: Lint
        run: ruff check src tests app.py

      - name: Test
        run: pytest -q --cov=ledgerlens --cov-report=term-missing

  # The tests that need what the app extra installs, which the test job leaves out on
  # purpose: the dashboard's need Streamlit, and one of the workpaper's needs pyarrow.
  # Streamlit requires pyarrow, and with pyarrow pandas 3 keeps text columns in Arrow.
  # Installed in the test job, it would end the suite's only runs on pandas 3 without
  # pyarrow (that job's 3.11 and 3.12 legs), which is what an install without the app
  # extra has. So those two test files run here as well, under the last Streamlit that
  # Python 3.9 can install (1.50) and under the newest. The rest of the suite does not
  # run in CI with pyarrow installed.
  dashboard:
    # 3.9 on 24.04, as in the test job: setup-python has no 3.9 for ubuntu-latest.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm,app]"

      # Both files skip the tests whose package they cannot import, and with two files
      # collected a file that skipped itself is still a green job. This step fails
      # instead, and its log says which versions the tests below ran under.
      - name: Import what the tests below would skip without
        run: |
          python -c "import anthropic, pyarrow, streamlit; from streamlit.testing.v1 import AppTest; print('streamlit', streamlit.__version__, 'pyarrow', pyarrow.__version__, 'anthropic', anthropic.__version__)"

      - name: Test the dashboard and the workpaper
        run: pytest -q tests/test_app.py tests/test_report.py

  # Rule 1 in CLAUDE.md: no ledgers, labels, workpapers, review databases or
  # secrets are ever committed. This checks file names in the final tree; the
  # committed eval rows are covered by a test in the test job, which rebuilds
  # every stored prompt under evals/narratives/runs/ from the default synthetic
  # ledger. Paths are read NUL-separated because git quotes and escapes any
  # name with a non-ASCII byte, which would defeat a line-based grep.
  rule-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No data or secret files are tracked
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C   # match bytes: grep in a UTF-8 locale skips lines holding invalid UTF-8
          pattern='\.csv$|\.xlsx$|\.parquet$|\.sqlite$|^data/|^\.env$|\.sqlite3$|\.db$|(^|/)\.env(\..*)?$|(^|/)secrets/|qbo-(sandbox|production)-[^/]*\.json$|\.controls\.json$'
          tmp=$(mktemp -d)

          # On its own line so a git failure fails the step instead of reading as "no match".
          git ls-files -z > "$tmp/tracked"
          # Tracked files that .gitignore would ignore, i.e. force-added with `git add -f`.
          git ls-files -z --cached --ignored --exclude-standard > "$tmp/bad"
          # Tracked files matching the rule-1 patterns, any case; grep exit 1 = no match, >1 = error.
          rc=0
          grep -zaiE -e "$pattern" "$tmp/tracked" >> "$tmp/bad" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::rule-1 check could not run: grep exited $rc"
            exit 2
          fi

          sort -zu "$tmp/bad" > "$tmp/bad.sorted"
          n=0
          while IFS= read -r -d '' f; do
            case $f in .env.example|*/.env.example) continue ;; esac  # re-included by .gitignore on purpose
            f=${f//'%'/%25}; f=${f//$'\r'/%0D}; f=${f//$'\n'/%0A}    # one annotation per path
            printf '::error::tracked data or secret file: %s\n' "$f"
            n=$((n + 1))
          done < "$tmp/bad.sorted"
          if [ "$n" -gt 0 ]; then exit 1; fi
          echo "rule 1 holds: no data or secret files tracked"

  # Proves the documented numbers in the README are reproducible from a clean
  # checkout. If a change quietly degrades detection, this fails rather than
  # the README silently going stale.
  detection-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate ledger and evaluate
        run: |
          ledgerlens generate --out-dir data
          ledgerlens test data/ledger.csv --labels data/labels.csv

      - name: Assert detection has not regressed
        run: |
          python - <<'PY'
          import sys
          from ledgerlens import evaluate, jets
          from ledgerlens.ingest import load_csv, load_labels

          df = load_csv("data/ledger.csv")
          labels = load_labels("data/labels.csv")
          flags = jets.run_all(df)
          m = evaluate.evaluate(flags, labels, df["entry_id"].unique())

          print(evaluate.DETECTION_CAVEAT)  # a public log: the figures are partly circular
          print(evaluate.format_report(m))

          floors = {"precision": 0.80, "recall": 0.90}
          failed = [k for k, floor in floors.items() if m[k] < floor]
          if failed:
              for k in failed:
                  print(f"::error::{k} {m[k]:.3f} fell below floor {floors[k]:.2f}")
              sys.exit(1)
          print("detection quality within expected bounds")
          PY
