[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "1.2.2"
description = "Audit analytics for general ledger data: journal-entry tests, Benford's Law, anomaly scoring and reviewer-ready exception reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jason Figueroa" }]
keywords = ["audit", "accounting", "journal-entry-testing", "benford", "anomaly-detection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  # 2.2 made pandas.tseries.api.guess_datetime_format public, which ingest reads dates with.
  "pandas>=2.2",
  "numpy>=1.23",
  "scikit-learn>=1.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# mypy 1.19 is the last release that runs on Python 3.9; newer Pythons get a newer one.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.19"]
# 1.49: st.dataframe takes width="stretch", which app.py gives it.
app = ["streamlit>=1.49"]
llm = ["anthropic>=0.125"]
# The MCP SDK needs 3.10+; the marker keeps 3.9 installs working.
mcp = ["mcp>=2,<3; python_version >= '3.10'"]

[project.scripts]
ledgerlens = "ledgerlens.cli:main"
ledgerlens-mcp = "ledgerlens.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledgerlens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Two decimals, because CI's test job fails under a coverage floor (--cov-fail-under) and the
# total is compared as it is printed: at whole percents a total up to half a point under
# the floor rounds up to it and passes.
[tool.coverage.report]
precision = 2
# A signature written only for a type checker never runs.
exclude_also = ["if TYPE_CHECKING:"]

# No python_version here: mypy 2 no longer checks for Python 3.9, so each mypy checks for
# the Python it runs on (3.9 under mypy 1.19, the newest elsewhere). pandas, scikit-learn,
# scipy and openpyxl ship no types, so whatever comes out of them is Any: the check covers
# the package's own signatures, its handling of None, and its standard-library code. The
# MCP SDK cannot be installed on Python 3.9, where its imports are missing.
[tool.mypy]
files = ["src/ledgerlens", "tests/typed_callers.py"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
  "pandas", "pandas.*", "sklearn", "sklearn.*", "scipy", "scipy.*",
  "openpyxl", "openpyxl.*", "mcp", "mcp.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
