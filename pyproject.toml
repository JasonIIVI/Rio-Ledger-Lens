[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "0.3.0"
description = "Audit analytics for general ledger data: journal-entry tests, Benford's Law, anomaly scoring and reviewer-ready exception reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jason Figueroa" }]
keywords = ["audit", "accounting", "journal-entry-testing", "benford", "anomaly-detection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]
app = ["streamlit>=1.30"]
llm = ["anthropic>=0.125"]
# The MCP SDK needs 3.10+; the marker keeps 3.9 installs working.
mcp = ["mcp>=2,<3; python_version >= '3.10'"]

[project.scripts]
ledgerlens = "ledgerlens.cli:main"
ledgerlens-mcp = "ledgerlens.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
